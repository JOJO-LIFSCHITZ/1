name: Hebrew Wikipedia + Wikiquote + Hamichlol to HTML

on:
  workflow_dispatch:
    inputs:
      build_wikipedia:
        description: "Build Hebrew Wikipedia"
        required: true
        type: boolean
        default: true

      build_wikiquote:
        description: "Build Hebrew Wikiquote"
        required: true
        type: boolean
        default: true

      hamichlol_zim_url:
        description: "Hamichlol ZIM direct download URL"
        required: false
        type: string
        default: "https://dev.hamichlol.org.il/w/upload/michlol/hamichlol_he_zimnew_novid_2026-03.zim"
        

      variant:
        description: "Wikipedia ZIM type: nopic = full articles without images, mini = only the intro of each article (small, good for a first test)"
        required: true
        type: choice
        options:
          - nopic
          - mini
        default: nopic

      wikipedia_zim_url:
        description: "Optional: direct URL of the Wikipedia .zim (empty = newest from download.kiwix.org)"
        required: false
        type: string
        default: ""

      wikiquote_zim_url:
        description: "Optional: direct URL of the Wikiquote .zim (empty = newest from download.kiwix.org)"
        required: false
        type: string
        default: ""

      part_mb:
        description: "Target size of every HTML file in MB (a file may go a little over). If it does not work, try 5"
        required: true
        type: string
        default: "10"

      keep_references:
        description: "Keep the footnotes/references list (bigger files)"
        required: true
        type: choice
        options:
          - "false"
          - "true"
        default: "false"

      limit:
        description: "Optional: only the first N articles of each source (for testing, e.g. 3000). Empty = all"
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: wiki-he-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      any: ${{ steps.m.outputs.any }}
    steps:
      - name: Decide which sources to build
        id: m
        env:
          WIKIPEDIA: ${{ inputs.build_wikipedia }}
          WIKIQUOTE: ${{ inputs.build_wikiquote }}
          HAMICHLOL_URL: ${{ inputs.hamichlol_zim_url }}
        run: |
          python3 - <<'PY'
          import json, os
          items = []
          if os.environ["WIKIPEDIA"] == "true":
              items.append({"source": "wikipedia", "title": "ויקיפדיה העברית", "base": "Wikipedia-he"})
          if os.environ["WIKIQUOTE"] == "true":
              items.append({"source": "wikiquote", "title": "ויקיציטוט העברית", "base": "Wikiquote-he"})
          if os.environ["HAMICHLOL_URL"].strip():
              items.append({"source": "hamichlol", "title": "המכלול", "base": "Hamichlol"})
          out = os.environ["GITHUB_OUTPUT"]
          with open(out, "a") as f:
              f.write("matrix=" + json.dumps({"include": items}) + "\n")
              f.write("any=" + ("true" if items else "false") + "\n")
          print(items)
          PY

  build:
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: pip install libzim lxml

      - name: Install Chrome (Hamichlol only)
        if: matrix.source == 'hamichlol'
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Find and download the ZIM file
        env:
          SOURCE: ${{ matrix.source }}
          VARIANT: ${{ inputs.variant }}
          WIKIPEDIA_URL: ${{ inputs.wikipedia_zim_url }}
          WIKIQUOTE_URL: ${{ inputs.wikiquote_zim_url }}
          HAMICHLOL_URL: ${{ inputs.hamichlol_zim_url }}
        run: |
          set -euo pipefail
          mkdir -p work output
          ZIM_URL=""
          case "$SOURCE" in
            wikipedia) ZIM_URL="$WIKIPEDIA_URL" ;;
            wikiquote) ZIM_URL="$WIKIQUOTE_URL" ;;
            hamichlol) ZIM_URL="$HAMICHLOL_URL" ;;
          esac
          if [ -z "$ZIM_URL" ]; then
            ZIM_URL="$(python3 - <<'PY'
          import os, re, sys, urllib.request
          source = os.environ["SOURCE"]
          variant = os.environ["VARIANT"]
          if source == "wikipedia":
              base = "https://download.kiwix.org/zim/wikipedia/"
              pat = r'wikipedia_he_all_%s_(\d{4}-\d{2})\.zim' % re.escape(variant)
              name = "wikipedia_he_all_%s_%%s.zim" % variant
          else:
              base = "https://download.kiwix.org/zim/wikiquote/"
              pat = r'wikiquote_he_all_maxi_(\d{4}-\d{2})\.zim'
              name = "wikiquote_he_all_maxi_%s.zim"
          req = urllib.request.Request(base, headers={"User-Agent": "Mozilla/5.0"})
          html = urllib.request.urlopen(req, timeout=60).read().decode("utf-8", "replace")
          found = re.findall(pat, html)
          if not found:
              sys.stderr.write("No matching .zim in %s - pass the zim url manually (see library.kiwix.org)\n" % base)
              sys.exit(1)
          print(base + name % max(found))
          PY
          )"
          fi
          echo "ZIM URL: $ZIM_URL"
          if [ "$SOURCE" = "hamichlol" ]; then
            # Hamichlol blocks plain curl: open it through a real Chrome, which then downloads the file
            python3 chrome_download.py "$ZIM_URL" work/src.zim
          else
            curl -fL --retry 10 --retry-delay 15 --retry-all-errors -C - -A "Mozilla/5.0" -o work/src.zim "$ZIM_URL"
          fi
          ls -lh work/src.zim
          test "$(stat -c %s work/src.zim)" -gt 1000000
          # a real ZIM file starts with the bytes 5a 49 4d 04
          test "$(head -c 4 work/src.zim | od -An -tx1 | tr -d ' \n')" = "5a494d04"
          df -h /

      - name: Build offline HTML (one folder per letter, files by size, named by first and last article)
        env:
          PART_MB: ${{ inputs.part_mb }}
          KEEP_REFS: ${{ inputs.keep_references }}
          LIMIT: ${{ inputs.limit }}
          TITLE: ${{ matrix.title }}
          BASE: ${{ matrix.base }}
        run: |
          set -euo pipefail
          EXTRA=""
          if [ "$KEEP_REFS" = "true" ]; then EXTRA="$EXTRA --keep-references"; fi
          if [ -n "$LIMIT" ]; then EXTRA="$EXTRA --limit $LIMIT"; fi
          python3 wiki_he_to_html.py \
            --zim work/src.zim \
            --workdir work/tmp \
            --outdir output \
            --part-mb "$PART_MB" \
            --title "$TITLE" \
            --base-name "$BASE" \
            --zip $EXTRA
          ls -lh output
          df -h /

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ matrix.source }}-he-${{ github.run_number }}
          name: ${{ matrix.title }} - HTML לא מקוון (${{ github.run_number }})
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: output/*.zip
