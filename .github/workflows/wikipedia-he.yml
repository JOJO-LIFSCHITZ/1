name: Hebrew Wikipedia to HTML (5 Parts)

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "ZIM type: nopic = full articles without images, mini = only intro"
        required: true
        type: choice
        options:
          - nopic
          - mini
        default: nopic

      zim_url:
        description: "Optional: direct URL of a .zim file (leave empty = newest from download.kiwix.org)"
        required: false
        type: string
        default: ""

      keep_references:
        description: "Keep the footnotes/references list"
        required: true
        type: choice
        options:
          - "false"
          - "true"
        default: "false"

      release_name:
        description: "Release name"
        required: true
        type: string
        default: "Hebrew-Wikipedia-Offline-5Parts"

permissions:
  contents: write

concurrency:
  group: wikipedia-he-5parts-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: pip install libzim lxml requests

      - name: Run Converter
        run: |
          python wikipedia_to_html.py --zim "${{ github.event.inputs.zim_url }}" --zip ${{ github.event.inputs.keep_references == 'true' && '--keep-references' || '' }}
        env:
          ZIM_URL: ${{ github.event.inputs.zim_url }}

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ github.run_id }}
          name: ${{ github.event.inputs.release_name }}
          files: output/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
