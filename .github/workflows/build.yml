name: Build Micropedia Talmudit

on:
  workflow_dispatch:

# חובה לתת הרשאה לגיטהאב ליצור Release
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          
      - name: Run Scraper
        run: python yeshiva_scraper.py
        
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: micropedia-${{ github.run_number }}
          name: "מיקרופדיה תלמודית - HTML לא מקוון (${{ github.run_number }})"
          files: output/Micropedia-Talmudit.zip
