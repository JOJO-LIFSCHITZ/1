name: Beta - test HTML files (custom sizes)

on:
  workflow_dispatch:
    inputs:
      sizes:
        description: "Optional: JavaScript viewer files, sizes in MB (leave empty - your app blocks JavaScript)"
        required: false
        type: string
        default: ""
      static_sizes:
        description: "Plain HTML files (no JavaScript): sizes in MB, comma separated"
        required: true
        type: string
        default: "30,50,100"

permissions:
  contents: write

jobs:
  beta:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: pip install lxml

      - name: Build the 3 test files
        run: |
          set -euo pipefail
          python3 make_beta_files.py --outdir output_beta --sizes "${{ inputs.sizes }}" --static-sizes "${{ inputs.static_sizes }}"
          ls -lh output_beta

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta-${{ github.run_number }}
          name: Beta - קבצי בדיקה (${{ github.run_number }})
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: output_beta/*.html
